name: Neon Snake

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=#00ff6a&color_dots=#16162a,#3b1259,#8a1fad,#00a8a2,#00f0e8

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: regenerate snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
