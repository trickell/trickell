name: dev.to Badges & Neon Sign

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/devto.yml
      - .github/scripts/devto.mjs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build badges + follower sign
        env:
          DEVTO_USERNAME: trickell
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node .github/scripts/devto.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/devto-followers.svg
          git diff --cached --quiet || (git commit -m "chore: refresh dev.to badges & follower sign" && git push)
