<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" role="img" aria-label="divider">
<style>
.pulse{animation:pulse 3.2s ease-in-out infinite}
.run{animation:run 4s linear infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes run{0%{transform:translateX(-160px)}100%{transform:translateX(1060px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#8a1fad" stop-opacity="0"/>
    <stop offset=".2" stop-color="#a855f7"/>
    <stop offset=".5" stop-color="#00f0e8"/>
    <stop offset=".8" stop-color="#a855f7"/>
    <stop offset="1" stop-color="#8a1fad" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="spark" x1="0" x2="1">
    <stop offset="0" stop-color="#00ff6a" stop-opacity="0"/>
    <stop offset=".5" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#00ff6a" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-5%" y="-300%" width="110%" height="700%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g filter="url(#glow)">
  <rect class="pulse" x="0" y="6" width="900" height="2" fill="url(#g)"/>
  <rect class="run" x="0" y="5.5" width="140" height="3" fill="url(#spark)"/>
</g>
</svg>
